<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#2E1A0E">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>スパイスの勇者と日蝕の魔王</title>
<link rel="stylesheet" href="./spice-hero/web/build/src/ui/style.css">
<link rel="stylesheet" href="./spice-hero/web/fc-ios-controller.css">
<script type="importmap">{"imports":{"phaser":"./spice-hero/web/vendor/phaser.esm.min.js"}}</script>
<script src="./spice-hero/web/ios.js"></script>
    <meta property="og:title" content="スパイスの勇者と日蝕の魔王">
    <meta property="og:description" content="スマホ・PCのブラウザで遊べる無料ゲームです。インストール不要！">
    <meta property="og:url" content="https://titan11111.github.io/329-spice-yuusha/">
    <meta property="og:type" content="website">
    <meta name="twitter:card" content="summary">
</head>
<body>
<div id="game-shell">
  <div id="game-stage">
    <div id="screen-wrap">
      <div id="game-root">
        <div id="game-canvas"></div>
        <div id="ui-overlay"></div>
      </div>
      <div id="pause-layer">ポーズ<small>タップで つづける</small></div>
    </div>
  </div>
  <div id="control-deck" class="fc-control-deck" aria-label="操作盤">
    <div class="fc-deck-left">
      <div class="fc-dpad-wrap" id="fc-dpad-wrap" aria-label="十字キー">
        <div class="fc-dpad" id="fc-dpad" data-up="0" data-down="0" data-left="0" data-right="0">
          <div class="fc-dpad-v"></div>
          <div class="fc-dpad-h"></div>
          <div class="fc-dpad-c"></div>
        </div>
      </div>
    </div>
    <div class="fc-deck-center">
      <button type="button" class="fc-sysbtn" id="fc-btn-select" aria-label="メニュー">メニュー</button>
    </div>
    <div class="fc-deck-right">
      <div class="fc-ab" aria-label="A B ボタン">
        <button type="button" class="fc-abbtn fc-abbtn-b" id="fc-btn-b" aria-label="もどる"><i>B</i><span class="fc-cap">もどる</span></button>
        <button type="button" class="fc-abbtn fc-abbtn-a" id="fc-btn-a" aria-label="けってい"><i>A</i><span class="fc-cap">けってい</span></button>
      </div>
    </div>
  </div>
</div>
<script src="./spice-hero/web/fc-ios-controller.js"></script>
<script type="module" src="./spice-hero/web/build/src/main.js"></script>
</body>
</html>
